<title>Space Blocks Mobile</title>
<style>
/* Layout: full-screen canvas map, slim status bar on top, order panel docked at bottom. Single dark space look. */
:root{--bg:#060812;--panel:#0c1426;--panel2:#142038;--edge:#3c82aa;--text:#c8e1f0;--dim:#6e8ca5;--accent:#5adcff;--aeth:#9682ff;--warn:#ffbe5a;--bad:#ff6464;--good:#6eeba0;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.3 system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;height:100%;display:flex;flex-direction:column}
canvas{flex:1;min-height:0;width:100%;display:block}
#top{display:flex;gap:8px;align-items:center;padding:6px max(10px,env(safe-area-inset-left,0px)) 6px max(10px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--edge)}
#top .res{flex:1;font-variant-numeric:tabular-nums;font-weight:600;color:var(--aeth);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .res small{color:var(--dim);font-weight:400}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--edge);border-radius:6px;padding:9px 11px;min-height:40px}
button:active{background:var(--edge)}
button.on{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.4}
#bot{background:var(--panel);border-top:1px solid var(--edge);padding:8px max(10px,env(safe-area-inset-left,0px)) 8px max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:7px}
#chips{display:flex;gap:6px;overflow-x:auto}
.chip{flex:0 0 auto;display:flex;flex-direction:column;gap:3px;min-width:92px;text-align:left;padding:6px 8px}
.chip b{font-size:13px}.chip i{font-style:normal;font-size:11px;color:var(--dim)}
.bar{height:4px;background:#0006;border-radius:2px;overflow:hidden}.bar>div{height:100%}
#info{font-size:12px;color:var(--dim);min-height:32px}
#info b{color:var(--text)}
#orders{display:flex;gap:6px;flex-wrap:wrap}
#orders button{flex:1 1 70px;padding:9px 4px}
#log{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:54px;right:80px;pointer-events:none;font-size:12px;text-shadow:0 1px 3px #000}
#log div{margin-bottom:2px}
#talk{position:absolute;left:10px;right:10px;bottom:150px;background:#0b1224f0;border:1px solid var(--edge);border-radius:8px;padding:10px 12px;display:none}
#talk b{display:block;margin-bottom:3px}
#sheet,#menu{position:absolute;inset:0;background:#040610e8;display:none;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:16px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:9px;max-height:92%;overflow:auto}
.card h2{margin:0;font-size:17px;color:var(--accent);letter-spacing:.05em;text-transform:uppercase}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row span{min-width:0}.row small{color:var(--dim);display:block}
#title{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#14234a,#050710 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
#title h1{margin:0;font-size:34px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
#title p{margin:0;color:var(--dim);max-width:320px}
#title button{width:240px;font-size:16px}
</style>
<div id="app">
<div id="top"><div class="res" id="res"></div><button id="bScan">SCAN</button><button id="bSpd">x1</button><button id="bMus">MUSIC</button><button id="bMenu">MENU</button></div>
<canvas id="cv"></canvas>
<div id="log"></div>
<div id="talk"></div>
<div id="bot"><div id="chips"></div><div id="info"></div><div id="orders"></div></div>
<div id="sheet"><div class="card" id="sheetCard"></div></div>
<div id="menu"><div class="card"><h2>Command Menu</h2><button id="mSave">Save now</button><button id="mClose">Resume</button><button id="mNew">New game (erases save)</button></div></div>
<div id="title"><h1>Space Blocks</h1><p>Commander Jason, the Executor is adrift among the floating islands. Send your pilots to mine Aetherite and keep the fleet alive.</p><button id="bCont">Continue</button><button id="bNew">New game</button><p style="font-size:12px">Drag to pan. Pinch or use the wheel to zoom. Tap a pilot, then tap an island and press LOCK ON.</p></div>
</div>
<script>
"use strict";
const W=3200,EX={x:1600,y:1600},KEY="spaceblocks_mobile_v1";
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d");
let G=null,sel=null,selIsl=null,cam={x:EX.x,y:EX.y,z:.45},speed=1,logs=[],started=false,mseed=1;
function rnd(){mseed=(mseed*16807)%2147483647;return (mseed-1)/2147483646}
const CREW=[
 {name:"Mira Voss",color:"#ff7a8a",bold:1,lines:["Aetherite never sleeps, Commander. Neither do I.","I'll take the far rocks. Someone has to."]},
 {name:"Tobias Kline",color:"#ffd070",bold:.3,lines:["Give me a bigger tank and I'll haul you a mountain.","Engines first, speeches later."]},
 {name:"Zeph",color:"#7ad0ff",bold:.6,lines:["The waterfalls on these islands fall upward at night. I swear it.","I only mined a little. The rest I watched."]},
 {name:"Okoye Adeyemi",color:"#9bf0a0",bold:.5,lines:["Old hands, steady burn. Reporting for duty, Commander."]},
 {name:"Pip",color:"#e8a0ff",bold:1,lines:["Is it true you can outrun a storm? I can!"]}];
const NAMES=["Halcyon","Veil","Cirrus","Ember","Mirage","Tern","Lull","Aster","Brume","Kestrel","Solace","Quill","Drift","Fern"];
function newGame(){
 mseed=Math.floor(Math.random()*1e6)+1;
 const isl=[];
 for(let i=0;i<14;i++){
  let x,y,ok,t=0;
  do{const a=rnd()*6.283,r=450+rnd()*1150;x=EX.x+Math.cos(a)*r;y=EX.y+Math.sin(a)*r;ok=isl.every(o=>Math.hypot(o.x-x,o.y-y)>260);t++}while(!ok&&t<50);
  const s=70+rnd()*60;
  isl.push({id:i,name:NAMES[i],x,y,s,aeth:120+rnd()*260,max:0,found:false,seed:rnd()*1000});
  isl[i].max=isl[i].aeth;
 }
 isl.sort((a,b)=>Math.hypot(a.x-EX.x,a.y-EX.y)-Math.hypot(b.x-EX.x,b.y-EX.y));
 isl.forEach((o,i)=>o.id=i);
 for(let i=0;i<3;i++)isl[i].found=true;
 G={t:0,aeth:80,delivered:0,up:{sensors:0,quarters:0},ships:[],isl,beats:{},found:3,seed:mseed};
 for(let i=0;i<3;i++)addShip(i);
 cam={x:EX.x,y:EX.y,z:.45};
 sel=G.ships[0];selIsl=null;logs=[];
 say("Commander Jason, welcome aboard the Executor.");
}
function addShip(i){const c=CREW[i];G.ships.push({idx:i,name:c.name,color:c.color,x:EX.x,y:EX.y+190,state:"docked",wait:2,fuel:20,cargo:0,lv:{eng:0,las:0,tank:0,car:0},loy:100,indep:false,order:{type:"auto"},target:null,wp:null,svc:0,trips:0})}
function stat(s){return{speed:100+28*s.lv.eng,mine:1.2+.9*s.lv.las,fuel:20+10*s.lv.tank,cargo:8+6*s.lv.car}}
function say(m,c){logs.push({m,c:c||"#c8e1f0",t:6});if(logs.length>5)logs.shift();console.log("[game] "+m)}
function talk(s,txt){const b=$("talk");b.style.display="block";b.innerHTML="<b style='color:"+s.color+"'>"+s.name+"</b>"+txt;clearTimeout(talk.t);talk.t=setTimeout(()=>b.style.display="none",4500)}
function chat(s,kind){const c=CREW[s.idx];if(!c)return;talk(s,c.lines[Math.floor(Math.random()*c.lines.length)])}

/* ---------- simulation ---------- */
function best(s,st){let b=null,bs=0;for(const i of G.isl){if(!i.found||i.aeth<20)continue;const d=Math.hypot(i.x-EX.x,i.y-EX.y);if(d*2*.0085>st.fuel*.85)continue;const crowd=G.ships.filter(o=>o!==s&&o.target===i.id).length;const sc=i.aeth/(d+400)*(1-.3*Math.min(crowd,3))+(CREW[s.idx].bold)*d*.00004;if(sc>bs){b=i;bs=sc}}return b}
function plan(s){
 const st=stat(s),o=s.order;
 if(!s.indep&&(!o||o.type==="hold"))return null;
 if(!s.indep&&o.type==="scout")return{scout:1};
 if(!s.indep&&o.type==="mine"){const i=G.isl[o.isl];if(i.found&&i.aeth>=15&&Math.hypot(i.x-EX.x,i.y-EX.y)*2*.0085<=st.fuel*.9)return{isl:i};say(i.name+" is spent for "+s.name+". Switching to auto.","#ffbe5a");s.order={type:"auto"}}
 if(s.trips>0&&s.trips%3===0&&s.lastScout!==s.trips&&G.isl.some(i=>!i.found)){s.lastScout=s.trips;return{scout:1}}
 const i=best(s,st);return i?{isl:i}:{scout:1}}
function launch(s,p){
 s.state="out";s.wait=0;
 if(p.isl){s.target=p.isl.id;s.wp=[{x:EX.x,y:EX.y+400},hover(p.isl)];say(s.name+" locked onto "+p.isl.name+" and launched.","#5adcff")}
 else{s.target=null;const a=Math.random()*6.283,r=900+Math.random()*1100;s.wp=[{x:EX.x,y:EX.y+400},{x:Math.max(150,Math.min(W-150,EX.x+Math.cos(a)*r)),y:Math.max(150,Math.min(W-150,EX.y+Math.sin(a)*r))}];s.scout=1;say(s.name+" launched on a scouting run.")}
 chat(s)}
function hover(i){return{x:i.x,y:i.y-i.s*.25}}
function goHome(s){s.state="in";s.target=null;s.scout=0;s.wp=[{x:EX.x,y:EX.y+400},{x:EX.x,y:EX.y+190}]}
function giveOrder(s,type,isl){
 if(s.indep&&Math.random()<(CREW[s.idx].bold>.8?.7:.4)){s.loy=Math.min(100,s.loy+12);talk(s,"No. I have my own plans right now.");say(s.name+" refused the order.","#ff6464");return false}
 if(s.indep){s.indep=false;say(s.name+" is back under your command.","#6eeba0")}
 s.loy=100;s.order=isl!=null?{type,isl}:{type};
 if(type==="mine"){s.target=isl;say(s.name+" locked onto "+G.isl[isl].name+".","#5adcff");if(s.state==="out"||s.state==="mining"){s.state="out";s.wp=[hover(G.isl[isl])]}}
 if((type==="return"||type==="hold")&&(s.state==="out"||s.state==="mining"))goHome(s);
 if(type==="scout"&&(s.state==="out"||s.state==="mining"))goHome(s);
 if(type==="return")s.order=null;
 chat(s);return true}
function step(dt){
 G.t+=dt;
 const sens=300+130*G.up.sensors;
 for(const s of G.ships){
  const st=stat(s);
  s.loy-=dt*(s.indep?0:(s.order&&s.order.type!=="hold"?.15:.5)/(1+.35*G.up.quarters));
  if(!s.indep&&s.loy<=0){s.indep=true;s.loy=0;s.order=null;say(s.name+" has gone independent!","#ffbe5a");talk(s,"You left me alone too long, Commander. I'll look after myself now.")}
  if(s.state==="docked"){
   if(s.fuel<st.fuel){const need=Math.min(st.fuel-s.fuel,dt*6),cost=need*.4;if(G.aeth>=cost){G.aeth-=cost;s.fuel+=need}}
   if(s.cargo>0){const d=Math.min(s.cargo,dt*10);s.cargo-=d;const share=s.indep?.6:1;G.aeth+=d*share;G.delivered+=d*share;if(s.cargo<=.01){s.cargo=0;s.trips++}}
   s.wait-=dt;
   if(s.wait<=0&&s.cargo<=0&&s.fuel>=st.fuel*.3){const p=plan(s);if(p)launch(s,p);else s.wait=1.5}
  }else{
   const w=s.wp&&s.wp[0];
   if(w){const dx=w.x-s.x,dy=w.y-s.y,d=Math.hypot(dx,dy),mv=st.speed*dt;
    s.ang=Math.atan2(dy,dx);
    if(d<=mv){s.x=w.x;s.y=w.y;s.wp.shift();if(!s.wp.length)arrive(s)}else{s.x+=dx/d*mv;s.y+=dy/d*mv}
    s.fuel-=Math.min(mv,d)*.0085}
   for(const i of G.isl)if(!i.found&&Math.hypot(i.x-s.x,i.y-s.y)<sens*.8)discover(i,s);
   if(s.state==="mining"){const i=G.isl[s.target];const g=Math.min(st.mine*dt,i.aeth,st.cargo-s.cargo);i.aeth-=g;s.cargo+=g;if(s.cargo>=st.cargo-.01||i.aeth<=.5)goHome(s)}
   if(s.state==="out"||s.state==="mining"){const home=Math.hypot(s.x-EX.x,s.y-EX.y)*.0085*1.3;if(s.fuel<home+2&&s.state!=="in")goHome(s)}
   if(s.fuel<0)s.fuel=0
  }
 }
 for(const i of G.isl)i.aeth=Math.min(i.max,i.aeth+dt*.15);
 const b=G.beats;
 if(!b.f&&G.found>=5){b.f=1;say("Five islands charted. The map is filling in.","#5adcff")}
 if(!b.a&&G.delivered>=100){b.a=1;say("100 Aetherite delivered. Spend it on upgrades (tap a pilot, then UPGRADE).","#9682ff")}
 if(!b.o&&G.delivered>=150){b.o=1;addShip(3);say("Okoye Adeyemi has joined the crew.","#6eeba0");talk(G.ships[3],CREW[3].lines[0])}
 if(!b.p&&G.delivered>=500){b.p=1;addShip(4);say("Pip has joined the crew.","#6eeba0");talk(G.ships[4],CREW[4].lines[0])}
 if(!b.h&&G.delivered>=1500){b.h=1;say("The Executor's tanks hum. Haven is within reach. You did it, Commander.","#ffd070")}
 logs.forEach(l=>l.t-=dt);logs=logs.filter(l=>l.t>0)}
function discover(i,s){i.found=true;G.found++;say((s?s.name+" discovered ":"Discovered ")+i.name+" ("+Math.round(i.aeth)+" Aetherite).","#5adcff");if(s)chat(s)}
function arrive(s){
 if(s.state==="in"){s.state="docked";s.x=EX.x;s.y=EX.y+190;s.wait=2.5;s.scout=0;return}
 if(s.state==="out"){
  if(s.scout){s.scout=0;goHome(s);return}
  const i=G.isl[s.target];if(i&&i.aeth>1)s.state="mining";else goHome(s)}}
function doScan(){
 const r=700+260*G.up.sensors;let n=0;
 for(const i of G.isl)if(!i.found&&Math.hypot(i.x-EX.x,i.y-EX.y)<r){discover(i);n++}
 if(!n)say("Scan complete. Nothing new in range.");scanFx=1.2}
let scanFx=0;
const UP={sensors:["Sensor Array",100,4,"Wider scan and detection"],quarters:["Crew Quarters",140,3,"Crew stay loyal longer"]};
const SH={eng:["Engine",25,"Faster flight"],las:["Laser",30,"Faster mining"],tank:["Fuel tank",20,"Longer range"],car:["Cargo bay",20,"Bigger loads"]};
function cost(base,lv){return Math.round(base*(1+lv*.8))}
function openSheet(){
 const s=sel;let h="<h2>Upgrades</h2><div class='row'><span>Stores</span><b style='color:#9682ff'>"+Math.floor(G.aeth)+" Aetherite</b></div>";
 if(s){h+="<div style='color:#6e8ca5'>"+s.name+"'s ship</div>";for(const k in SH){const c=cost(SH[k][1],s.lv[k]);h+="<div class='row'><span>"+SH[k][0]+" Lv "+(s.lv[k]+1)+"<small>"+SH[k][2]+"</small></span><button data-s='"+k+"' "+(G.aeth<c||s.lv[k]>=8?"disabled":"")+">"+c+"</button></div>"}}
 h+="<div style='color:#6e8ca5'>The Executor</div>";
 for(const k in UP){const lv=G.up[k],c=cost(UP[k][1],lv);h+="<div class='row'><span>"+UP[k][0]+" Lv "+lv+"/"+UP[k][2]+"<small>"+UP[k][3]+"</small></span><button data-u='"+k+"' "+(G.aeth<c||lv>=UP[k][2]?"disabled":"")+">"+(lv>=UP[k][2]?"MAX":c)+"</button></div>"}
 h+="<button id='shClose'>Close</button>";
 $("sheetCard").innerHTML=h;$("sheet").style.display="flex";
 $("shClose").onclick=()=>$("sheet").style.display="none";
 document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const k=b.dataset.s,c=cost(SH[k][1],s.lv[k]);if(G.aeth>=c){G.aeth-=c;s.lv[k]++;s.fuel=Math.min(s.fuel,stat(s).fuel);say(s.name+" fitted a "+SH[k][0]+".","#6eeba0");sfx(520);openSheet()}});
 document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const k=b.dataset.u,c=cost(UP[k][1],G.up[k]);if(G.aeth>=c){G.aeth-=c;G.up[k]++;say(UP[k][0]+" upgraded.","#6eeba0");sfx(440);openSheet()}})}

/* ---------- UI ---------- */
function ui(){
 $("res").innerHTML=Math.floor(G.aeth)+" <small>Aetherite &middot; "+Math.floor(G.delivered)+" delivered &middot; "+G.found+"/"+G.isl.length+" charted</small>";
 const ch=$("chips"),ck=G.ships.length+"|"+(sel?sel.idx:-1);
 if(ch.dataset.k!==ck){ch.dataset.k=ck;
  ch.innerHTML=G.ships.map((s,i)=>"<button class='chip"+(s===sel?" on":"")+"' data-i='"+i+"' style='border-left:4px solid "+s.color+"'><b>"+s.name.split(" ")[0]+"</b><i></i><div class='bar'><div style='background:#5adcff'></div></div><div class='bar'><div></div></div></button>").join("");
  ch.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{sel=G.ships[+b.dataset.i];follow()})}
 G.ships.forEach((s,i)=>{const e=ch.children[i];if(!e)return;const st=stat(s),lc=s.indep?"#ffbe5a":s.loy<35?"#ff6464":"#6eeba0",t=s.indep?"independent":s.state;
  if(e.children[1].textContent!==t)e.children[1].textContent=t;
  e.children[2].firstChild.style.width=Math.min(100,s.fuel/st.fuel*100).toFixed(0)+"%";
  const bl=e.children[3].firstChild;bl.style.width=s.loy.toFixed(0)+"%";bl.style.background=lc});
 let inf="";
 if(sel){const st=stat(sel);inf="<b style='color:"+sel.color+"'>"+sel.name+"</b> "+(sel.indep?"(independent) ":"")+"fuel "+Math.round(sel.fuel)+"/"+st.fuel+", cargo "+Math.round(sel.cargo)+"/"+st.cargo+", order: "+(sel.order?sel.order.type+(sel.order.isl!=null?" "+G.isl[sel.order.isl].name:""):"none")}
 if(selIsl){inf+="<br><b>"+selIsl.name+"</b> "+(selIsl.found?Math.round(selIsl.aeth)+" Aetherite":"unknown")}
 if($("info").dataset.h!==inf){$("info").dataset.h=inf;$("info").innerHTML=inf}
 const o=$("orders");const key=(selIsl&&selIsl.found?"L":"")+(sel?sel.name:"");
 if(o.dataset.k!==key){o.dataset.k=key;
  o.innerHTML=(selIsl&&selIsl.found?"<button data-o='lock' class='on'>LOCK ON</button>":"")+"<button data-o='return'>RETURN</button><button data-o='hold'>HOLD</button><button data-o='scout'>SCOUT</button><button data-o='auto'>AUTO</button><button data-o='up'>UPGRADE</button>";
  o.querySelectorAll("button").forEach(b=>b.onclick=()=>{const k=b.dataset.o;if(k==="up"){openSheet();return}if(!sel)return;if(k==="lock")giveOrder(sel,"mine",selIsl.id);else giveOrder(sel,k)})}
 const lg=$("log");lg.innerHTML=logs.map(l=>"<div style='color:"+l.c+"'>"+l.m+"</div>").join("")}
function follow(){if(sel){cam.x=sel.x;cam.y=sel.y}}

/* ---------- rendering ---------- */
const stars=[];for(let i=0;i<160;i++)stars.push([Math.random(),Math.random(),Math.random()*1.4+.3,Math.random()]);
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener("resize",resize);
const sx=x=>(x-cam.x)*cam.z+cv.clientWidth/2, sy=y=>(y-cam.y)*cam.z+cv.clientHeight/2;
function tree(x,y,h,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,y-h);ctx.lineTo(x+h*.38,y);ctx.lineTo(x-h*.38,y);ctx.fill()}
function drawIsland(i,t){
 const x=sx(i.x),y=sy(i.y),r=i.s*cam.z;
 if(x<-r*2||y<-r*2||x>cv.clientWidth+r*2||y>cv.clientHeight+r*2)return;
 const bob=Math.sin(t*.6+i.seed)*3*cam.z;
 ctx.save();ctx.translate(x,y+bob);
 if(!i.found){ctx.globalAlpha=.4;ctx.fillStyle="#5a6a90";ctx.beginPath();ctx.ellipse(0,0,r*.9,r*.3,0,0,6.283);ctx.fill();ctx.restore();
  ctx.fillStyle="#6e8ca5";ctx.font="bold "+Math.max(12,14*cam.z)+"px system-ui";ctx.textAlign="center";ctx.fillText("?",x,y+5);return}
 const g=ctx.createLinearGradient(0,0,0,r*1.1);g.addColorStop(0,"#5c4a40");g.addColorStop(1,"#241c2c");
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-r,0);ctx.quadraticCurveTo(-r*.6,r*.9,-r*.1,r*1.3);ctx.quadraticCurveTo(r*.5,r*.9,r,0);ctx.closePath();ctx.fill();
 const wx=r*.45;ctx.strokeStyle="rgba(150,220,255,.75)";ctx.lineWidth=Math.max(1.5,3*cam.z);ctx.setLineDash([6,5]);ctx.lineDashOffset=-t*40;
 ctx.beginPath();ctx.moveTo(wx,r*.1);ctx.lineTo(wx,r*1.5);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle="#3e9a52";ctx.beginPath();ctx.ellipse(0,0,r,r*.3,0,0,6.283);ctx.fill();
 ctx.fillStyle="#58c26a";ctx.beginPath();ctx.ellipse(0,-r*.04,r*.85,r*.22,0,0,6.283);ctx.fill();
